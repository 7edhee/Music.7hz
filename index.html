<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Music Player</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    body {
      font-family: 'Orbitron', monospace;
      margin: 0;
      background: #2b2118;
      background-image: radial-gradient(#3a2f23 1px, transparent 1px);
      background-size: 4px 4px;
      color: #f5e6c4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      cursor: none; /* hide default cursor */
    }

    /* ===== CURSOR TRAIL ===== */
    .trail {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #ffcc66 0%, #ff8800 70%, transparent 100%);
      box-shadow: 0 0 10px #ffaa33, 0 0 20px #ff8800;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.5s ease-out;
      z-index: 9999;
    }

    .player {
      width: 100%;
      max-width: 650px;
      background: #d4b98a;
      border: 8px solid #8b6f47;
      border-radius: 20px;
      box-shadow: inset 0 0 0 4px #5a4328, 0 20px 40px rgba(0,0,0,0.5);
      padding: 1.5rem;
      cursor: default;
    }

    .brand {
      text-align: center;
      color: #2b2118;
      margin-bottom: 1rem;
    }
    .brand h1 { margin: 0; font-size: 1.4rem; letter-spacing: 2px; }
    .brand p { margin: 0; font-size: 0.7rem; opacity: 0.7; }
